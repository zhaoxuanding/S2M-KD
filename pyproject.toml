[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s2m-kd"
version = "0.1.0"
description = "Swin-to-MobileNetV3 knowledge distillation for poultry disease classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Zhaoxuan Ding"},
  {name = "Fengchuang Xing"}
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9",
  "tqdm>=4.66",
  "numpy>=1.24",
  "pillow>=10.0",
  "scikit-learn>=1.3"
]

[tool.setuptools.packages.find]
where = ["src"]

